[package]
name = "ev-powertrain-torque-vectoring-rust"
version = "0.1.0"
edition = "2021"
authors = ["Ardavan Ghal-Eh <ardavang2007@gmail.com>"]
description = "High-Performance Dual-Motor EV Dynamic Torque Vectoring & Stability Controller in Rust"
license = "MIT"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[lib]
name = "torque_vectoring"
crate-type = ["cdylib", "rlib"]
